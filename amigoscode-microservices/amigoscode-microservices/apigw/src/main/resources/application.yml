server:
  port: 8083
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: customer
          uri: lb://CUSTOMER
          predicates:
            - Path=/api/v1/customers/**
  zipkin:
    base-url: http://localhost:9411/
# Eureka client configuration
# Also add -Djava.rmi.server.hostname=127.0.0.1 to VM options on VPN if needed
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
      fetch-registry: true
      register-with-eureka: true