  customer:
    image: ihorderevtsov/customer:latest
    container_name: customer
    ports:
      - "8010:8010"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - spring
      - postgres
    depends_on:
      - zipkin
      - postgres
      - rabbitmq
  fraud:
    image: ihorderevtsov/fraud:latest
    container_name: fraud
    ports:
      - "8020:8020"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - spring
      - postgres
    depends_on:
      - zipkin
      - postgres
      - rabbitmq
  notification:
    image: ihorderevtsov/notification:latest
    container_name: notification
    ports:
      - "8030:8030"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - spring
      - postgres
    depends_on:
      - zipkin
      - postgres
      - rabbitmq

networks:
  postgres:
    driver: bridge
  spring:
    driver: bridge

volumes:
  amigoscode_microservices_dev_postgres_data: # creates a volume to persist data on the machine
