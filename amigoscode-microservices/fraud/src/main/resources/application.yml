server:
  port: 8081

spring:
  application:
    name: fraud
  datasource:
    url: jdbc:postgresql://localhost:5432/fraud
    username: appuser
    password: password
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    hibernate:
      # none - does nothing
      # validate - validates the schema, checks if tables exist, makes no changes to the database
      # update - updates the schema, creates/updates tables and columns as necessary
      # create - removes existing schema and creates a new one, destroying previous data
      # create-drop - the same as create, but drops the schema when the session ends
      ddl-auto: update
    show-sql: true
